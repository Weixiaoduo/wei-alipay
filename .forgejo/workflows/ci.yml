name: candidate-ci
on:
  push:
  pull_request:

jobs:
  first-party:
    strategy:
      matrix:
        include:
          - php: "7.4"
            runner: php-7.4
          - php: "8.3"
            runner: php-8.3
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - name: Checkout exact commit without a Node action runtime
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify immutable PHP runtime
        run: |
          php -r 'exit(strpos(PHP_VERSION, (string) getenv("EXPECTED_PHP")) === 0 ? 0 : 1);'
        env:
          EXPECTED_PHP: ${{ matrix.php }}
      - run: composer install --no-interaction --prefer-dist
      - run: ./scripts/tests/run-tests.sh all
      - if: matrix.php == '8.3'
        run: composer analyse
      - if: matrix.php == '8.3'
        run: ./scripts/ci-local.sh
