name: candidate-ci
on:
  push:
  pull_request:

jobs:
  first-party:
    strategy:
      matrix:
        include:
          - php: "7.4"
            runner: php-7.4
            skip_js: "1"
          - php: "8.3"
            runner: php-8.3
            skip_js: "0"
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - name: Checkout exact commit without a Node action runtime
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify immutable PHP runtime
        run: |
          php -r 'exit(strpos(PHP_VERSION, (string) getenv("EXPECTED_PHP")) === 0 ? 0 : 1);'
        env:
          EXPECTED_PHP: ${{ matrix.php }}
      - name: Run credential-free first-party tests
        run: ./scripts/tests/run-tests.sh all
        env:
          WEI_ALIPAY_SKIP_JS_SYNTAX: ${{ matrix.skip_js }}
      - name: Verify reproducible release candidate without network credentials
        if: matrix.php == '8.3'
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          SOURCE_DATE_EPOCH="$source_date_epoch" ./scripts/build-release-candidate.sh /tmp/wei-alipay-ci-a
          SOURCE_DATE_EPOCH="$source_date_epoch" ./scripts/build-release-candidate.sh /tmp/wei-alipay-ci-b
          cmp /tmp/wei-alipay-ci-a/wei-alipay-4.0.1-candidate.zip /tmp/wei-alipay-ci-b/wei-alipay-4.0.1-candidate.zip
