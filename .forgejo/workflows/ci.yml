name: candidate-ci
on:
  push:
  pull_request:

jobs:
  first-party:
    strategy:
      matrix:
        php: ['7.4', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: https://github.com/shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: ./scripts/tests/run-tests.sh all
      - if: matrix.php == '8.3'
        run: composer analyse
      - if: matrix.php == '8.3'
        run: ./scripts/ci-local.sh
