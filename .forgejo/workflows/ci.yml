name: candidate-ci
on:
  push:
  pull_request:

jobs:
  first-party:
    strategy:
      matrix:
        include:
          - php: "7.4"
            runner: php-7.4
            skip_js: "1"
          - php: "8.3"
            runner: php-8.3
            skip_js: "0"
    runs-on: ${{ matrix.runner }}
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - name: Checkout exact commit without a Node action runtime
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify immutable PHP runtime
        run: |
          php -r 'exit(strpos(PHP_VERSION, (string) getenv("EXPECTED_PHP")) === 0 ? 0 : 1);'
        env:
          EXPECTED_PHP: ${{ matrix.php }}
      - name: Run credential-free first-party tests before dependency downloads
        run: ./scripts/tests/run-tests.sh all
        env:
          WEI_ALIPAY_SKIP_JS_SYNTAX: ${{ matrix.skip_js }}
      - name: Install PHPStan dependencies with bounded retries
        if: matrix.php == '8.3'
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if timeout 600s env COMPOSER_PROCESS_TIMEOUT=540 composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
      - if: matrix.php == '8.3'
        run: composer analyse
      - if: matrix.php == '8.3'
        run: ./scripts/ci-local.sh
